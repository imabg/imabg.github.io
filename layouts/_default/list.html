{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  {{ $pages := .Pages }}
  {{ if $pages }}
    <ul class="post-list">
      {{ range $pages }}
        <li>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  {{ else }}
    <p class="muted">Nothing here yet.</p>
  {{ end }}
{{ end }}
