{{ define "main" }}
  <article class="post">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      <p class="meta">
        {{ with .Date }}<time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2 Jan 2006" }}</time>{{ end }}
        {{ with .Params.categories }}
          <span class="sep">·</span>
          {{ range . }}<a class="pill" href="{{ "/categories/" | relURL }}{{ . | urlize }}/">{{ . }}</a>{{ end }}
        {{ end }}
        {{ partial "post-tags.html" . }}
      </p>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
  </article>
{{ end }}
