<!DOCTYPE html>
<html lang="en" data-palette="paper">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="wrap">
      {{ partial "header.html" . }}
      <main>
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
    {{ $theme := resources.Get "js/theme.js" }}
    {{ if hugo.IsProduction }}
      {{ $theme = $theme | minify | fingerprint }}
    {{ end }}
    <script src="{{ $theme.RelPermalink }}" defer{{ if hugo.IsProduction }} integrity="{{ $theme.Data.Integrity }}"{{ end }}></script>
  </body>
</html>
