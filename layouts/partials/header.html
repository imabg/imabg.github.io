<header class="site-header">
  <div class="masthead">
    {{ if .IsHome }}
      <h1 class="site-title"><a href="{{ "/" | relURL }}">{{ site.Title }}</a></h1>
    {{ else }}
      <p class="site-title"><a href="{{ "/" | relURL }}">{{ site.Title }}</a></p>
    {{ end }}
    {{ with site.Params.tagline }}
      <p class="site-tagline">{{ . }}</p>
    {{ end }}
  </div>
  <div class="site-header-end">
    <nav class="site-nav" aria-label="Main">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      {{ partial "social-links.html" . }}
    </nav>
    <div class="theme-controls">
      <div class="palette-picker">
        <button type="button" class="theme-toggle" data-palette-toggle aria-expanded="false" aria-haspopup="listbox" aria-controls="palette-menu" aria-label="Color theme">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="7.5" cy="9" r="3.1" fill="currentColor"/>
            <circle cx="16.5" cy="9" r="3.1" fill="currentColor" opacity=".72"/>
            <circle cx="12" cy="16.2" r="3.1" fill="currentColor" opacity=".44"/>
          </svg>
        </button>
        <ul id="palette-menu" class="palette-menu" role="listbox" hidden>
          <li>
            <button type="button" role="option" data-palette="paper">
              <span class="palette-swatch" aria-hidden="true"></span>
              Paper
            </button>
          </li>
          <li>
            <button type="button" role="option" data-palette="nord">
              <span class="palette-swatch" aria-hidden="true"></span>
              Nord
            </button>
          </li>
          <li>
            <button type="button" role="option" data-palette="solarized">
              <span class="palette-swatch" aria-hidden="true"></span>
              Solarized
            </button>
          </li>
          <li>
            <button type="button" role="option" data-palette="catppuccin">
              <span class="palette-swatch" aria-hidden="true"></span>
              Catppuccin
            </button>
          </li>
        </ul>
      </div>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12.1 22c5.1 0 9.3-3.8 9.9-8.7-1.3.6-2.7.9-4.2.9-5.4 0-9.8-4.4-9.8-9.8 0-1.5.3-2.9.9-4.2C4 1.8.2 6 .2 11.1.2 17.1 5.1 22 12.1 22z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </div>
</header>
