<header class="site-header">
  <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <div class="site-header-end">
    <nav class="site-nav" aria-label="Main">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color theme">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M12.1 22c5.1 0 9.3-3.8 9.9-8.7-1.3.6-2.7.9-4.2.9-5.4 0-9.8-4.4-9.8-9.8 0-1.5.3-2.9.9-4.2C4 1.8.2 6 .2 11.1.2 17.1 5.1 22 12.1 22z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>
