{{ $type := partial "post-type.html" . }}
<li data-type="{{ $type }}">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02-01-2006" }}</time>
  <span class="post-item">
    <a class="post-item-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ partial "post-tags.html" . }}
  </span>
</li>
