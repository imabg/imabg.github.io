<li>
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  <span class="post-item">
    <a class="post-item-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .GetTerms "tags" }}
      <span class="post-item-tags">
        {{ range . }}<a class="pill" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
      </span>
    {{ end }}
  </span>
</li>
