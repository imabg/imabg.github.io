{{ $kind := .type | default "item" }}
<li class="reading-row reading-{{ $kind }}">
  {{ if eq $kind "book" }}
    {{ if .cover }}
      <img class="reading-cover" src="{{ .cover }}" alt="" width="48" height="72" loading="lazy">
    {{ else }}
      <span class="reading-cover reading-cover-fallback" aria-hidden="true"></span>
    {{ end }}
  {{ else }}
    <span class="reading-kind">{{ $kind }}</span>
  {{ end }}
  <div class="reading-meta">
    {{ if .url }}
      <a href="{{ .url }}">{{ .title }}</a>
    {{ else }}
      <span class="reading-title">{{ .title }}</span>
    {{ end }}
    <p>
      {{ with .authors }}<span>{{ . }}</span>{{ end }}
      {{ with .source }}<span class="muted">{{ . }}</span>{{ end }}
    </p>
  </div>
</li>
