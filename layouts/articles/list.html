{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  {{ $pages := .Pages.ByDate.Reverse }}
  {{ if $pages }}
    <div class="articles-archive">
      <div class="articles-grid">
        {{ range $pages }}
          {{ partial "article-list-item.html" . }}
        {{ end }}
      </div>
    </div>
  {{ else }}
    <p class="muted">No articles yet.</p>
  {{ end }}
{{ end }}
